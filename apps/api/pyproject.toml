[project]
name = "openposture-api"
version = "0.1.0"
description = "OpenPosture FastAPI service."
requires-python = ">=3.11"

# The top of the dependency graph. Depends on both packages; nothing depends on this.
# Web/DB/LLM dependencies arrive with the tickets that introduce them (Epics D, E, F) rather
# than being declared speculatively here. The Anthropic client is therefore still absent — it
# lands in Epic F.
dependencies = [
    "posture-core",
    "pose-backends",
    # Lower bounds, not pins. The pins in this workspace exist where a version is load-bearing
    # (mediapipe 0.10.18, numpy<2) and nowhere else; pinning by reflex makes a real constraint
    # indistinguishable from an arbitrary one.
    "fastapi>=0.115",
    # Config as a typed, validated object rather than scattered os.environ lookups. Ships
    # separately from pydantic itself, which fastapi already pulls in.
    "pydantic-settings>=2.7",
    # Structured logging. The legacy engine's entire observability story was bare `print()`
    # (FINDINGS §3), so the replacement emits machine-parseable events with a request ID.
    "structlog>=24.4",
    "boto3>=1.35",
    "pillow>=11.0",
    "python-multipart>=0.0.18",
    # 2.0 for the typed `Mapped[]` declarative style — the reason `mypy --strict` can see the
    # models at all. The `asyncio` extra pulls greenlet, which SQLAlchemy needs to run its
    # synchronous internals under an event loop.
    "sqlalchemy[asyncio]>=2.0.36",
    # The async Postgres driver. Not psycopg: the API is async end to end, and a synchronous
    # driver blocks the event loop for the duration of every query.
    "asyncpg>=0.30",
    # Schema migration. Runs in the container entrypoint behind a Postgres advisory lock so
    # concurrent API replicas serialise rather than race on DDL. Ships as a runtime dependency
    # (not dev-only) because the container needs it to start.
    "alembic>=1.14",
]

[project.optional-dependencies]
# The ASGI server is only needed to *run* the app, not to import or test it: `TestClient` drives
# the application through ASGI directly. Keeping it out of the base install means the test job
# does not build a server it never starts.
serve = ["uvicorn[standard]>=0.51.0"]

# The real pose backend. `pose-backends` keeps mediapipe optional so the fake backend can run
# without a 300 MB inference stack; this extra is how the container image — which does want
# real inference — asks for it by name rather than by pinning mediapipe a second time here.
inference = ["pose-backends[mediapipe]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openposture_api"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "moto[s3]>=5.2.2",
    # Lets the model and session tests run in-process, with no container and no Postgres. The
    # models are deliberately dialect-neutral — `Uuid`, `JSON` and `native_enum=False` all map
    # onto SQLite — so these tests exercise the real mappings, real constraints and the real
    # session dependency. What they cannot exercise is Postgres-specific behaviour; that is
    # E4's `testcontainers` suite, which is a different ticket for a reason.
    "aiosqlite>=0.20",
]
