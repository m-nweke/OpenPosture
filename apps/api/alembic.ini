# Alembic configuration.
#
# The database URL is NOT read from this file. env.py constructs it from Settings, which reads
# OPENPOSTURE_DATABASE_URL (defaulting to the Compose service). The value below is a placeholder
# that satisfies alembic's ini parser; it is overridden unconditionally at runtime.

[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(slug)s
truncate_slug_length = 40
timezone = UTC

# Placeholder — overridden by env.py.
sqlalchemy.url = postgresql+asyncpg://openposture:openposture-dev-only@db:5432/openposture

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
