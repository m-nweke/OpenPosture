[project]
name = "posture-spec"
version = "0.1.0"
description = "The tuning surface of the rules engine, as data both language implementations load."
requires-python = ">=3.11"

# Depends on posture-core for the `Thresholds` shape it parses into. The direction matters:
# posture-core stays I/O-free — it is the package whose suite must run anywhere in seconds — and
# this package is where reading a file is allowed to happen.
dependencies = ["posture-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posture_spec"]
