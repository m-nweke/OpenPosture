[project]
name = "posture-core"
version = "0.1.0"
description = "Pure posture rules engine: geometry, metrics, findings. No I/O, no globals, no frameworks."
requires-python = ">=3.11"

# DELIBERATELY MINIMAL. numpy is the only runtime dependency this package may ever have.
#
# Adding anything heavy here (mediapipe, fastapi, sqlalchemy, opencv) breaks the architectural
# argument of the whole project and will fail tests/test_dependency_isolation.py.
#
# numpy is pinned <2 because mediapipe 0.10.18 requires it, and a split numpy version across
# the workspace would make the resolver pick one and silently break the other. See ADR-0002.
dependencies = ["numpy>=1.26,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posture_core"]
