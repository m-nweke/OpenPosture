# Fast local checks that mirror the `lint` and `web-lint` jobs in .github/workflows/pr.yml.
#
# Deliberately excludes mypy and pytest: they are slower than a commit should be, and CI runs
# them on every push anyway. The goal here is to catch the trivial things before they cost a
# CI round trip, not to reimplement the pipeline.
#
#   uv tool install pre-commit && pre-commit install

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix]
      - id: ruff-format
        name: ruff (format)

  # React side (OP-13). `language: system` runs the oxlint and prettier already installed in
  # apps/web/node_modules rather than a second copy pinned here, so local hooks and the
  # web-lint job cannot drift to different versions. They no-op if you have never run
  # `npm ci` in apps/web.
  - repo: local
    hooks:
      # Note the `if/else` rather than a trailing `|| true`: swallowing the exit code would
      # make the hook pass on real lint errors, which is worse than not having it.
      - id: oxlint
        name: oxlint (apps/web)
        language: system
        files: ^apps/web/.*\.(ts|tsx)$
        pass_filenames: false
        entry: >
          bash -c 'cd apps/web && if [ -x node_modules/.bin/oxlint ]; then npm run --silent lint;
          else echo "skipped: run npm ci in apps/web"; fi'

      - id: prettier
        name: prettier (apps/web)
        language: system
        files: ^apps/web/.*\.(ts|tsx|css|json|html|md)$
        pass_filenames: false
        entry: >
          bash -c 'cd apps/web && if [ -x node_modules/.bin/prettier ]; then
          npm run --silent format:check; else echo "skipped: run npm ci in apps/web"; fi'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Legacy sources are preserved byte-for-byte as audit evidence (docs/FINDINGS.md cites
        # their line numbers); fixtures are binary and must not be rewritten.
        exclude: ^(docs/archive/|fixtures/)
      - id: end-of-file-fixer
        exclude: ^(docs/archive/|fixtures/)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # The 209 MB model.h5 is exactly the mistake this prevents repeating.
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
