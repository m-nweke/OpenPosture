# Backing-service integration.
#
# `pr.yml` proves the code is correct against fakes and in-memory doubles. `containers.yml` proves
# both application images build and wire together. This proves the *backing services* — Postgres
# and MinIO — come up, become genuinely ready, bootstrap themselves and can be talked to.
#
# They fail for reasons the other two workflows structurally cannot see. A healthcheck that
# reports ready before Postgres accepts TCP connections, a bucket that never gets created, an
# `mc` invocation that fails and exits 0 anyway: every one of those passes a unit test and passes
# an image build, and then produces an intermittent failure roughly one run in five.
#
# **No application image is built here.** That is `containers.yml`'s job and it costs minutes,
# because the API image carries the inference stack. This workflow starts three services that are
# all pulled, not built, and runs the API from the uv workspace when it needs one — so it is the
# fast check of the two, and its failures are unambiguously about the services rather than about
# the Dockerfile.
#
# Created in OP-49 alongside the services themselves, per the delivery rule: a capability and its
# check ship together.

name: integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Named explicitly rather than relying on the Compose defaults. If a default in
  # docker-compose.yml changes, this workflow keeps asserting against the value it was written
  # for, and the mismatch is a failure here rather than a green run that proved nothing.
  POSTGRES_USER: openposture
  POSTGRES_PASSWORD: openposture-dev-only
  POSTGRES_DB: openposture
  MINIO_ROOT_USER: openposture
  MINIO_ROOT_PASSWORD: openposture-dev-only
  OPENPOSTURE_S3_BUCKET: openposture

jobs:
  services:
    name: services come up and bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-project
        with:
          python: "3.12"

      - name: Start the backing services from a clean state
        # `--wait` blocks until both are healthy, so this step failing *is* the healthcheck
        # assertion. Only `db` and `minio` are named: `api` and `web` need an image build, which
        # is `containers.yml`'s job.
        #
        # **`minio-init` is deliberately not in this list.** `--wait` means "running or healthy",
        # and a one-shot that has exited is neither — naming it here makes Compose exit 1 on a
        # perfectly successful bootstrap. `containers.yml` gets away with an unqualified
        # `up --wait` only because `api` is in that invocation and declares `minio-init` as a
        # `service_completed_successfully` dependency, which is what tells Compose the exit is
        # expected. Here nothing does, so the one-shot is started and waited on separately below.
        #
        # The timeout is generous because a cold `docker pull` of Postgres and MinIO is most of
        # the wall clock here.
        run: docker compose up -d --wait --wait-timeout 180 db minio

      - name: The bucket bootstrap runs to completion
        # `docker wait` on the container id, not `docker compose wait` on the service name.
        #
        # `up -d` alone proves nothing: it returns as soon as the container is *started*, so a
        # bootstrap that died on its first command looks identical to one that worked. But
        # `docker compose wait` is racy for a one-shot this fast — it attaches to running
        # containers, and against a warm image the bootstrap has already exited by the time it
        # looks, which reports `no containers for project` and fails a successful run.
        # `docker wait` returns immediately with the recorded exit code of a container that has
        # already finished, so it is correct whether the race is won or lost.
        run: |
          docker compose up -d minio-init
          code="$(docker wait "$(docker compose ps -aq minio-init)")"
          echo "minio-init exited ${code}"
          test "${code}" = "0"

      - name: Every service reached the state it should have
        # `--wait` succeeding is the real gate; this makes the states visible in the log so a
        # future failure can be read without re-running locally. `minio-init` must be *exited*,
        # not running — a bootstrap that never terminates would leave anything depending on
        # `service_completed_successfully` waiting forever.
        run: |
          docker compose ps -a --format 'table {{.Service}}\t{{.Status}}'
          docker compose ps --status running --services | grep -qx db
          docker compose ps --status running --services | grep -qx minio
          test "$(docker compose ps -a --format '{{.Service}} {{.ExitCode}}' | grep '^minio-init ' | cut -d' ' -f2)" = "0"

      - name: Postgres accepts a real query over TCP
        # Through the published port, from the runner rather than from inside the container.
        # `docker compose exec psql` would go over the unix socket and prove less: the socket is
        # accepting connections seconds before the TCP listener is, which is the exact race the
        # healthcheck exists to close.
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -p 5432 \
            -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc 'select 1' | grep -qx 1
          echo "OK  postgres answered over TCP"

      - name: The bucket was bootstrapped
        # The container runs `mc` and nothing else; the assertion happens on the runner. The
        # `minio/mc` image is a scratch-style image with no `grep`, and an assertion written
        # inside it fails with "grep: command not found" — which, at the end of a pipeline, is a
        # step that exits 0 and proves nothing. Exactly the failure mode this workflow exists to
        # catch, so it should not be reintroduced here.
        run: |
          docker compose run --rm --entrypoint sh minio-init -c '
            set -e
            mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
            mc ls local
          ' > /tmp/buckets
          cat /tmp/buckets
          grep -q "${OPENPOSTURE_S3_BUCKET}/" /tmp/buckets

      - name: Bootstrapping twice is not an error
        # The property that matters for `docker compose up` on an existing checkout: the volume
        # already has the bucket, and the one-shot must still exit 0. Without `--ignore-existing`
        # this fails, and it fails in a way that blocks the API from ever starting again, because
        # `service_completed_successfully` is never satisfied.
        run: |
          docker compose up -d --force-recreate minio-init
          code="$(docker wait "$(docker compose ps -aq minio-init)")"
          echo "minio-init exited ${code} on a populated volume"
          test "${code}" = "0"

      - name: The API's own engine reaches Postgres
        # Through `create_engine(Settings())` rather than through psql, so what is exercised is
        # the configured URL, the asyncpg driver and the pool the application will actually use.
        # The step above proves Postgres is up; this proves the API can talk to it, which are
        # different claims and fail for different reasons — a wrong driver prefix
        # (`postgresql://` instead of `postgresql+asyncpg://`) passes the first and fails here.
        env:
          OPENPOSTURE_DATABASE_URL: postgresql+asyncpg://openposture:openposture-dev-only@127.0.0.1:5432/openposture
        run: |
          uv run python - <<'PY'
          import asyncio

          from sqlalchemy import text

          from openposture_api.config import Settings
          from openposture_api.db import close_engine, create_engine, create_session_factory


          async def main() -> None:
              engine = create_engine(Settings())
              factory = create_session_factory(engine)
              async with factory() as session:
                  database = (await session.execute(text("select current_database()"))).scalar_one()
                  server = (await session.execute(text("show server_version"))).scalar_one()
              await close_engine(engine)
              assert database == "openposture", database
              print(f"connected to {database} on postgres {server}")


          asyncio.run(main())
          PY

      - name: Initial migration applies cleanly
        # `alembic upgrade head` against a fresh database. This is the happy path: a clean schema
        # the schema matches the models. The advisory lock is exercised by this step too (it is
        # acquired on every run, released when the connection closes).
        env:
          OPENPOSTURE_DATABASE_URL: postgresql+asyncpg://openposture:openposture-dev-only@127.0.0.1:5432/openposture
        run: |
          uv run alembic -c apps/api/alembic.ini upgrade head
          echo "OK  initial migration applied"

      - name: Downgrade and re-upgrade both succeed
        # The only real test that a downgrade path exists and works. Downgrades are written once,
        # never exercised, and are broken more often than not — "it compiles" is not the same claim
        # as "it runs against a real database".
        env:
          OPENPOSTURE_DATABASE_URL: postgresql+asyncpg://openposture:openposture-dev-only@127.0.0.1:5432/openposture
        run: |
          uv run alembic -c apps/api/alembic.ini downgrade base
          echo "OK  downgraded to base"
          uv run alembic -c apps/api/alembic.ini upgrade head
          echo "OK  re-upgraded to head"

      - name: Advisory lock serializes two concurrent migrators
        # Proves the advisory lock actually works under the race it was written for. Both
        # migrators start simultaneously against the same database after a downgrade — only one
        # performs the migration, the other acquires the lock afterwards and finds nothing to do.
        # Both must exit 0.
        #
        # `wait $pid1; code1=$?` captures each exit code independently. A bare `wait` reports the
        # last job only, which would hide a failure by the first.
        env:
          OPENPOSTURE_DATABASE_URL: postgresql+asyncpg://openposture:openposture-dev-only@127.0.0.1:5432/openposture
        run: |
          uv run alembic -c apps/api/alembic.ini downgrade base
          uv run alembic -c apps/api/alembic.ini upgrade head &
          pid1=$!
          uv run alembic -c apps/api/alembic.ini upgrade head &
          pid2=$!
          wait $pid1; code1=$?
          wait $pid2; code2=$?
          echo "migrator 1 exited ${code1}"
          echo "migrator 2 exited ${code2}"
          test "${code1}" = "0"
          test "${code2}" = "0"
          echo "OK  advisory lock serialized both migrators"

      - name: No drift between models and the migrated schema
        # `alembic check` compares the current database state against Base.metadata and exits
        # non-zero if autogenerate would produce any operations. After `upgrade head`, an empty
        # diff is the definition of "the migration reproduced the schema exactly".
        #
        # This is the same principle as D7's OpenAPI drift job: the danger is not writing the
        # artifact, it is the artifact silently diverging from its source. A model field added
        # without a migration is invisible until a query fails in production — this catches it.
        env:
          OPENPOSTURE_DATABASE_URL: postgresql+asyncpg://openposture:openposture-dev-only@127.0.0.1:5432/openposture
        run: |
          uv run alembic -c apps/api/alembic.ini check
          echo "OK  no drift"

      - name: The API can store an object in MinIO
        # Run from the workspace rather than from the image, for the reason in the header. What
        # this catches that the moto-backed unit tests cannot: a wrong endpoint URL, credentials
        # that do not match the ones MinIO booted with, a bucket name that differs between the
        # bootstrap and the application, and path-style addressing — moto accepts virtual-host
        # style, a real MinIO on an IP address does not.
        #
        # **Placed after the migration steps, not with the other bucket checks.** This posts a
        # real image to `/analyses`, and since E5 that endpoint writes rows as well as an object,
        # so it needs a migrated schema. Run earlier it fails on the insert, and the failure
        # reads as a storage problem because of what the step is called.
        env:
          OPENPOSTURE_POSE_BACKEND: fake
          OPENPOSTURE_POSE_BACKEND_PRESET: hunchback
          OPENPOSTURE_STORAGE_BACKEND: s3
          OPENPOSTURE_S3_ENDPOINT_URL: http://127.0.0.1:9000
          OPENPOSTURE_S3_ACCESS_KEY: openposture
          OPENPOSTURE_S3_SECRET_KEY: openposture-dev-only
          # Without this, `Settings()` falls back to its default of `@db:5432` — the Compose
          # service name. That resolves inside the network and nowhere else, and this step runs
          # on the runner, so the symptom is a `socket.gaierror` surfacing as a 500 from the
          # endpoint rather than as anything that names the real problem.
          OPENPOSTURE_DATABASE_URL: postgresql+asyncpg://openposture:openposture-dev-only@127.0.0.1:5432/openposture
        run: |
          uv run python - <<'PY'
          import uuid

          from fastapi.testclient import TestClient

          from openposture_api.config import Settings
          from openposture_api.main import create_app

          with TestClient(create_app(Settings())) as client:
              # Since E8 the upload route requires a token, so this step has to hold a session
              # like any other client. Registered rather than minted with `issue_access_token`:
              # signing one here would prove only that the step can sign a token, while this
              # exercises the real register-then-use path against the migrated schema.
              registration = client.post(
                  "/api/v1/auth/register",
                  json={
                      # Unique per run, because the database persists across steps within a job.
                      "email": f"smoke-{uuid.uuid4().hex}@example.com",
                      "password": "a-sufficiently-long-smoke-test-password",
                  },
              )
              assert registration.status_code == 201, (
                  registration.status_code,
                  registration.text,
              )
              token = registration.json()["access_token"]

              with open("fixtures/images/desk_hunch.jpeg", "rb") as image:
                  response = client.post(
                      "/api/v1/analyses",
                      files={"image": ("desk_hunch.jpeg", image, "image/jpeg")},
                      headers={"Authorization": f"Bearer {token}"},
                  )

          assert response.status_code == 201, (response.status_code, response.text)
          key = response.json()["object_key"]
          assert key.startswith("analyses/"), key
          print("stored:", key)
          PY

      - name: Repository integration tests pass against a real Postgres
        # testcontainers starts its own Postgres container on a random port, separate from the
        # compose service. Docker is available on `ubuntu-latest` and is already in use by the
        # compose steps above, so no extra setup is needed.
        #
        # These tests prove the repository layer's behaviour under real Postgres semantics:
        # cursor pagination ordering, RETURNING on DELETE, and user_id scoping. They are
        # deliberately not in `pr.yml` — the SQLite suite there cannot exercise any of these.
        run: |
          uv run pytest apps/api/tests/integration/ -v --no-header
          echo "OK  repository integration tests passed"

      - name: The object is actually in the bucket
        # Asserted from MinIO's side, not from the API's response. A 201 carrying an object key
        # only says the application believes it wrote something.
        run: |
          docker compose run --rm --entrypoint sh minio-init -c '
            set -e
            mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
            mc ls --recursive "local/$OPENPOSTURE_S3_BUCKET"
          ' > /tmp/objects
          cat /tmp/objects
          grep -q "analyses/" /tmp/objects

      - name: Capture logs
        if: failure()
        run: docker compose logs --no-color > /tmp/integration-logs.txt 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-logs
          path: /tmp/integration-logs.txt
          retention-days: 7

      - name: Tear down cleanly
        # `-v` matters here more than anywhere else: the whole point of the idempotency step
        # above is that it ran against a *populated* volume, so leaving that volume behind would
        # make the next run's "clean state" a lie.
        if: always()
        run: docker compose down -v --remove-orphans

  integration-ok:
    name: integration-ok
    if: always()
    needs: [services]
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "services: ${{ needs.services.result }}"

      - name: Fail if any job did not succeed
        # Skipped counts as failure, as in containers.yml: nothing path-filters this workflow, so
        # a skipped job means something went wrong rather than "not relevant to this change".
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
