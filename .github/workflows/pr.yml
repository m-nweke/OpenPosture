# Required pull-request checks.
#
# This workflow goes live with the first Python package (OP-12) rather than being added later,
# because a package that merges before its gates exist accumulates untested code that someone
# then has to repair. It grows by ticket:
#
#   OP-12         Python: lint, typecheck, test-python
#   OP-13 (here)  React:  web-lint, web-typecheck, web-test, web-build, web-e2e
#   OP-14         hardening: concurrency cancellation, SHA-pinned actions, lockfile-keyed
#                 caches, a composite setup-project action, and a <=5 minute target
#   OP-50         API-specific coverage gate at 85%
#
# Job names are contracts: they become the required checks on the `main` ruleset in OP-15, and
# renaming one silently drops its protection.
#
# Every job here runs with no model weights, no database, no container and no secret.

name: PR

on:
  pull_request:
  push:
    branches: [main]

# Least privilege. Nothing here writes to the repository.
permissions:
  contents: read

env:
  # Pinned so a uv release cannot change CI behaviour without a visible diff.
  UV_VERSION: "0.11.32"
  # Same reasoning for Node. Matches the version in apps/web/README.md.
  NODE_VERSION: "22"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        # --frozen fails if uv.lock is out of date with the pyproject files, so a dependency
        # change that was never locked cannot merge.
        run: uv sync --all-packages --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: mypy --strict
        run: uv run mypy packages apps

  test-python:
    name: test-python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report both legs rather than cancelling the matrix on the first failure — a version
      # -specific break is exactly what this matrix exists to surface.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --frozen --python ${{ matrix.python-version }}

      - name: Test posture-core (95% coverage floor)
        # The rules engine carries the strictest gate in the project. It has no I/O, no model
        # and no database, so there is no excuse for untested branches here.
        run: >
          uv run --python ${{ matrix.python-version }}
          pytest packages/posture-core
          --cov=posture_core
          --cov-report=term-missing
          --cov-fail-under=95
          -m "not model"

      - name: Test workspace
        # `-m "not model"` deselects real-model tests. They need weights this job deliberately
        # never downloads, and run on demand in model-validation.yml (created in OP-21).
        run: uv run --python ${{ matrix.python-version }} pytest -m "not model"

  # ---------------------------------------------------------------------------
  # React (OP-13). Independent of the Python jobs and of each other, so they run
  # in parallel and a lint failure still reports the test result.
  #
  # Note there is deliberately no `paths:` filter on this workflow. A path filter
  # that skips the whole run leaves required checks permanently "expected" and the
  # pull request unmergeable. Cheap jobs on every PR beat a stuck merge queue.
  # ---------------------------------------------------------------------------

  web-lint:
    name: web-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what the lockfile
      # says and fails if package.json has drifted from it, so an unlocked
      # dependency change cannot merge. The Python jobs use `uv sync --frozen`
      # for the same reason.
      - run: npm ci

      - name: oxlint
        run: npm run lint

      - name: prettier --check
        run: npm run format:check

  web-typecheck:
    name: web-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      # `strict` was turned on in OP-13. Without it this job would pass on
      # implicit any and unchecked nulls, which is worse than no job at all.
      - name: tsc --noEmit
        run: npm run typecheck

  web-test:
    name: web-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      # The 70% floor lives in vite.config.ts so `npm run test:coverage` enforces
      # the same numbers locally that CI does. Thresholds cover statements,
      # branches, functions and lines — a lines-only gate is easy to clear while
      # leaving whole branches unexercised.
      - name: vitest (70% coverage floor)
        run: npm run test:coverage

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: vite build
        run: npm run build

  web-e2e:
    name: web-e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      # Chromium only. The suite exists to prove the app works end to end against
      # the production bundle, not to survey browser differences — a full matrix
      # would triple the runtime of the slowest job here for very little signal.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and serves the production bundle itself, so
      # this covers the real asset pipeline rather than the dev server.
      - name: playwright test
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        # Only on failure: the report is useless when everything passed and just
        # costs storage on every green run.
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
