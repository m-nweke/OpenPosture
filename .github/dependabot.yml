# Dependency updates.
#
# This is the other half of OP-14's action-pinning policy. Pinning `dorny/paths-filter` to a
# commit SHA freezes its vulnerabilities as effectively as its features, so pinning without an
# updater is how a workflow quietly sits on a known-bad version for a year. Dependabot is what
# makes the pin safe rather than merely strict.
#
# Grouping rule throughout: routine development-dependency bumps arrive as one reviewable pull
# request, and anything security-related arrives on its own. A security fix buried in a group of
# twelve unrelated bumps is a security fix nobody reads.

version: 2

updates:
  # ---- GitHub Actions ----------------------------------------------------
  - package-ecosystem: github-actions
    # Both entries are needed. For this ecosystem `/` means ".github/workflows plus an action.yml
    # in the repository root" — it does NOT recurse into .github/actions. Without the second
    # directory, the `astral-sh/setup-uv` and `actions/setup-node` pins inside the composite
    # action would never be updated, which is precisely the rot this file exists to prevent.
    directories:
      - /
      - /.github/actions/setup-project
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        # Actions are few and low-risk; one PR a week for all of them is less noise than five,
        # and they are reviewed together anyway since they all live in one workflow.
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---- Python (uv workspace) --------------------------------------------
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      python-dev:
        # Listed explicitly rather than via `dependency-type: development`, which GitHub supports
        # for npm and pip but not for uv — there it would be silently ignored and every tool would
        # arrive as its own pull request. Mirrors [dependency-groups].dev in pyproject.toml; add
        # here when adding there.
        patterns: ["mypy", "pytest", "pytest-*", "ruff", "hypothesis", "coverage"]
        update-types: ["minor", "patch"]
    ignore:
      # mediapipe is version-pinned deliberately, not lazily: 0.10.18 is the last release
      # publishing linux aarch64 wheels, and 0.10.20 onward would break arm64 entirely.
      # See docs/adr/0002-mediapipe-pose.md. Any bump here needs the spike rerun, so Dependabot
      # must not propose one.
      - dependency-name: mediapipe
      # Transitive ceilings mediapipe imposes on the whole workspace. Dependabot cannot know they
      # are load-bearing; a numpy 2.x PR would look routine and break inference.
      - dependency-name: numpy
        versions: [">=2.0"]
      - dependency-name: protobuf
        versions: [">=5.0"]

  # ---- npm (apps/web) ---------------------------------------------------
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      web-dev:
        dependency-type: development
        patterns: ["*"]
        update-types: ["minor", "patch"]
      react:
        # react and react-dom must move together or types stop matching.
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]

  # ---- Docker -----------------------------------------------------------
  # Inert until the first Dockerfile lands in OP-112. Declared now because the ticket scopes four
  # ecosystems and because the alternative — remembering to add it later — is how base images go
  # eighteen months without a patch. Until then Dependabot reports "no manifest found" for this
  # entry in the repository's Dependabot log; that warning is expected, not a misconfiguration.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docker"
